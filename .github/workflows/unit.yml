name: CI - lint and unit tests

on: push

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: cue-lang/setup-cue@v2.0.0
        with:
          version: v0.17.1

      - name:
          Install dependencies and Chromium (the session test runs a browser)
        run: bun run setup --frozen-lockfile

      - name: Report versions and browsers
        run: |
          echo "bun: $(bun --version)"
          cue version
          bun run browser:list

      - name: Run the ci gate
        run: bun run ci
