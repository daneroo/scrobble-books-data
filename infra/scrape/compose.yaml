# Run through the root Justfile: `just` lists the recipes.
# scrape: always on, cron. login: the sign-in desktop, only when asked.

x-common: &common
  build:
    context: ../..
    dockerfile: apps/scrape/Dockerfile
  image: scrobble-scrape
  restart: unless-stopped
  shm_size: 1gb
  logging:
    driver: json-file
    options:
      max-size: "5m"
  volumes:
    - ../../secrets/GOODREADS.env:/app/secrets/GOODREADS.env:ro
    - ../../secrets/S3.env:/app/secrets/S3.env:ro
    - ./secrets/browser-profile:/app/secrets/browser-profile
    - ./data:/app/data
    - ./config/autostart:/startapp.sh:ro

services:
  scrape:
    <<: *common
    entrypoint: ["bun", "run", "cron", "--publish"]
    init: true # reaps Chromium's orphans; SIGTERM reaches cron
    user: ${USER_ID:-1000}:${GROUP_ID:-1000}
    environment:
      HOME: /tmp # the host user has no home in the image

  login:
    <<: *common
    profiles: [login]
    ports:
      - "5800:5800"
    environment:
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
      KEEP_APP_RUNNING: 1 # closing the terminal restarts it
