# From the #58 prototype: `bun run login` in a desktop streamed to a browser
# tab. The base is chosen in apps/scrape/Dockerfile; the Selkies lines below
# are the fallback, to swap in with its base. The scrape and cron come with #59.
services:
  scrape:
    build:
      context: ../..
      dockerfile: apps/scrape/Dockerfile
    shm_size: 1gb
    # jlesage: http://<host>:5800
    ports:
      - "5800:5800"
    environment:
      # the host user's IDs, so the profile on the host stays theirs
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
      # restart the terminal if it is closed, instead of stopping the container
      KEEP_APP_RUNNING: 1
    volumes:
      - ${PROFILE_DIR:?set PROFILE_DIR to the host directory for the browser
        profile}:/app/secrets/browser-profile
      - ./config/autostart:/startapp.sh:ro
